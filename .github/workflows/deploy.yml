name: PulseNode Deployment & Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Compile & Verify Agent
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake autoconf automake pkg-config libuv1-dev liblz4-dev libjudy-dev libssl-dev zlib1g-dev libmnl-dev ninja-build

    - name: Configure PulseNode
      run: |
        mkdir build
        cd build
        cmake .. -G Ninja -DCMAKE_INSTALL_PREFIX=/usr/local/pulsenode

    - name: Build Core Engine
      run: |
        cd build
        ninja

    - name: Verify Startup Sequence
      run: |
        ./build/src/daemon/netdata -W buildinfo | grep "PulseNode"
        echo "✅ PulseNode Core Branding Verified"
