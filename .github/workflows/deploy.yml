name: PulseNode Deployment & Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Compile & Verify Agent
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: src/go/go.mod

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo bash ./packaging/installer/install-required-packages.sh --dont-wait --non-interactive netdata-all
        sudo apt-get install -y ninja-build libprotobuf-dev protobuf-compiler

    - name: Configure PulseNode
      run: |
        mkdir build
        cd build
        cmake .. -G Ninja -DCMAKE_INSTALL_PREFIX=/usr/local/pulsenode \
          -DENABLE_PLUGIN_FREEIPMI=Off \
          -DENABLE_PLUGIN_NFACCT=Off \
          -DENABLE_PLUGIN_XENSTAT=Off \
          -DENABLE_PLUGIN_EBPF=Off \
          -DENABLE_EXPORTER_PROMETHEUS_REMOTE_WRITE=Off

    - name: Build Core Engine
      run: |
        cd build
        ninja

    - name: Verify Startup Sequence
      run: |
        ./build/netdata -W buildinfo
        ./build/netdata -h | grep "PulseNode"
        echo "✅ PulseNode Core Branding Verified"
